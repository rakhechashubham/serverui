name: Desktop Release

# Intentional releases only: push a SemVer tag (vMAJOR.MINOR.PATCH).
# Does not publish from pushes to main.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v0.1.0). Leave empty when triggered by tag push."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      updater_key: ${{ steps.meta.outputs.updater_key }}
      apple_signing: ${{ steps.meta.outputs.apple_signing }}
      windows_signing: ${{ steps.meta.outputs.windows_signing }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and version
        id: meta
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH (got: $TAG)"
            exit 1
          fi
          VERSION="${TAG#v}"
          CONF_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [[ "$VERSION" != "$CONF_VERSION" ]]; then
            echo "Tag version $VERSION does not match tauri.conf.json version $CONF_VERSION"
            echo "Bump with: node apps/desktop/scripts/sync-version.mjs $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "updater_key=present" >> "$GITHUB_OUTPUT"
          else
            echo "updater_key=missing" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${APPLE_CERTIFICATE:-}" ]]; then
            echo "apple_signing=configured" >> "$GITHUB_OUTPUT"
          else
            echo "apple_signing=not_configured" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${WINDOWS_CERTIFICATE:-}" ]]; then
            echo "windows_signing=configured" >> "$GITHUB_OUTPUT"
          else
            echo "windows_signing=not_configured" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing ServerUI $VERSION ($TAG)"

  build:
    name: ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            platform: macos-arm64
            rust_target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            bundles: dmg
            verify_arch: arm64
          - name: macOS x64
            runner: macos-14
            platform: macos-x64
            rust_target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            bundles: dmg
            verify_arch: x86_64
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            bundles: appimage,deb
            verify_arch: x86-64
          - name: Windows x64
            runner: windows-latest
            platform: windows-x64
            rust_target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            bundles: nsis,msi
            verify_arch: x86-64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Install Linux WebKit dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Sync desktop version metadata
        run: node apps/desktop/scripts/sync-version.mjs

      - name: Build Go sidecar
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.rust_target }}
          FORCE_SIDECAR_REBUILD: "1"
        run: |
          chmod +x apps/desktop/scripts/prepare-sidecar.sh
          apps/desktop/scripts/prepare-sidecar.sh
          SIDECAR="apps/desktop/src-tauri/binaries/serverui-server-${{ matrix.rust_target }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            SIDECAR="${SIDECAR}.exe"
          fi
          test -f "$SIDECAR"
          file -b "$SIDECAR" || true
          if command -v file >/dev/null 2>&1; then
            info="$(file -b "$SIDECAR" || true)"
            if [[ "$info" != *"${{ matrix.verify_arch }}"* && "$info" != *"PE32+"* ]]; then
              echo "Sidecar architecture mismatch: expected ${{ matrix.verify_arch }}, got: $info"
              exit 1
            fi
          fi

      - name: Import Apple signing certificate (optional)
        if: matrix.goos == 'darwin'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "APPLE_CERTIFICATE not set; macOS build will be unsigned (NOT CONFIGURED)"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Apple signing certificate imported"

      - name: Import Windows Authenticode certificate (optional)
        if: matrix.goos == 'windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE not set; Windows build will be unsigned (NOT CONFIGURED)"
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Write-Host "WINDOWS_CERTIFICATE decoded to $pfxPath"
          Write-Host "Authenticode: certificate material present; Tauri/signtool must be configured to consume it."
          Write-Host "Status: CONFIGURED (material) — signing application not claimed tested."

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | awk '/^host:/{print $2}')"
          TARGET="${{ matrix.rust_target }}"
          ARGS=(--bundles ${{ matrix.bundles }})
          if [[ "$TARGET" != "$HOST" ]]; then
            ARGS=(--target "$TARGET" "${ARGS[@]}")
          fi
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Updater signing key present; building with createUpdaterArtifacts"
            npm run build -- "${ARGS[@]}"
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY secret; building with updater artifacts disabled"
            npm run build:unsigned -- "${ARGS[@]}"
          fi

      - name: Resolve bundle directory
        id: bundle
        run: |
          set -euo pipefail
          TARGET="${{ matrix.rust_target }}"
          HOST="$(rustc -vV | awk '/^host:/{print $2}')"
          BASE="apps/desktop/src-tauri/target"
          if [[ "$TARGET" == "$HOST" ]]; then
            if [[ -d "$BASE/$TARGET/release/bundle" ]]; then
              echo "dir=$BASE/$TARGET/release/bundle" >> "$GITHUB_OUTPUT"
            else
              echo "dir=$BASE/release/bundle" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "dir=$BASE/$TARGET/release/bundle" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify macOS Mach-O architecture
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          EXPECTED="${{ matrix.verify_arch }}"
          BUNDLE="${{ steps.bundle.outputs.dir }}"
          shopt -s nullglob
          dmgs=( "$BUNDLE"/dmg/*.dmg )
          shopt -u nullglob
          test ${#dmgs[@]} -gt 0
          # Prefer release binary under target tree
          BIN=""
          for cand in \
            "apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/serverui-desktop" \
            "apps/desktop/src-tauri/target/release/serverui-desktop"
          do
            if [[ -f "$cand" ]]; then BIN="$cand"; break; fi
          done
          if [[ -n "$BIN" ]]; then
            info="$(file -b "$BIN")"
            lipo_out="$(lipo -info "$BIN" 2>/dev/null || true)"
            echo "Release binary: $info"
            echo "lipo: $lipo_out"
            if [[ "$info" != *"$EXPECTED"* && "$lipo_out" != *"$EXPECTED"* ]]; then
              echo "Architecture mismatch for release binary"
              exit 1
            fi
          fi
          SIDECAR="apps/desktop/src-tauri/binaries/serverui-server-${{ matrix.rust_target }}"
          info="$(file -b "$SIDECAR")"
          lipo_out="$(lipo -info "$SIDECAR" 2>/dev/null || true)"
          echo "Sidecar: $info"
          if [[ "$info" != *"$EXPECTED"* && "$lipo_out" != *"$EXPECTED"* ]]; then
            echo "Architecture mismatch for Go sidecar"
            exit 1
          fi

      - name: Collect and rename artifacts
        run: |
          set -euo pipefail
          chmod +x scripts/collect-desktop-artifacts.sh
          OUT="dist/release/${{ matrix.platform }}"
          mkdir -p "$OUT"
          scripts/collect-desktop-artifacts.sh \
            --version "${{ needs.validate-tag.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --bundle-dir "${{ steps.bundle.outputs.dir }}" \
            --out-dir "$OUT" \
            --verify
          # macOS: ensure updater-compatible .app.tar.gz exists even when unsigned
          if [[ "${{ matrix.goos }}" == "darwin" ]]; then
            VERSION="${{ needs.validate-tag.outputs.version }}"
            case "${{ matrix.platform }}" in
              macos-arm64) ARCH_SUFFIX=arm64 ;;
              macos-x64) ARCH_SUFFIX=x64 ;;
            esac
            TAR="$OUT/ServerUI-${VERSION}-${ARCH_SUFFIX}.app.tar.gz"
            if [[ ! -f "$TAR" ]]; then
              BUNDLE="${{ steps.bundle.outputs.dir }}"
              DMG=( "$BUNDLE"/dmg/*.dmg )
              if [[ -f "${DMG[0]:-}" ]]; then
                TMP="$(mktemp -d)"
                MNT="$TMP/mnt"
                mkdir -p "$MNT"
                hdiutil attach "${DMG[0]}" -nobrowse -readonly -mountpoint "$MNT" >/dev/null
                cp -R "$MNT/ServerUI.app" "$TMP/ServerUI.app"
                hdiutil detach "$MNT" -quiet || hdiutil detach "$MNT" -force -quiet || true
                tar -C "$TMP" -czf "$TAR" ServerUI.app
                rm -rf "$TMP"
                echo "Created $TAR from DMG"
              fi
            fi
          fi
          ls -la "$OUT"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release

      - name: Flatten artifacts, checksums, updater JSON
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/collect-desktop-artifacts.sh
          # shellcheck source=scripts/lib/desktop-release.sh
          source scripts/lib/desktop-release.sh
          mkdir -p dist/publish
          find dist/release -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" "dist/publish/$(basename "$f")"
          done
          desktop_release_write_sha256sums dist/publish
          # Also keep a versioned copy of the sums for clarity on the release page.
          cp dist/publish/SHA256SUMS "dist/publish/ServerUI-${VERSION}-SHA256SUMS.txt"
          echo "Checksums:"
          cat dist/publish/SHA256SUMS
          node scripts/generate-updater-latest-json.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --dir dist/publish
          ls -la dist/publish
          # Guard: never ship a latest.json without matching .sig files.
          if [[ -f dist/publish/latest.json ]]; then
            if ! ls dist/publish/*.sig >/dev/null 2>&1; then
              echo "latest.json present without .sig files; refusing to publish fake updater manifest" >&2
              rm -f dist/publish/latest.json
            fi
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: ServerUI ${{ needs.validate-tag.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ServerUI ${{ needs.validate-tag.outputs.version }}

            Download the installer for your platform below. Verify integrity with `SHA256SUMS` (or `ServerUI-${{ needs.validate-tag.outputs.version }}-SHA256SUMS.txt`).

            ```bash
            shasum -a 256 -c SHA256SUMS
            # or: sha256sum -c SHA256SUMS
            ```

            See [docs/releases.md](https://github.com/${{ github.repository }}/blob/${{ needs.validate-tag.outputs.tag }}/docs/releases.md).

            ### Installers
            - macOS Apple Silicon: `ServerUI-*-arm64.dmg`
            - macOS Intel: `ServerUI-*-x64.dmg`
            - Windows x64: `ServerUI-*-x64-setup.exe` (optional `.msi`)
            - Linux x64: `ServerUI-*-x86_64.AppImage` and `ServerUI-*-amd64.deb`

            ### Signing status (this run)
            - Updater key (`TAURI_SIGNING_PRIVATE_KEY`): **${{ needs.validate-tag.outputs.updater_key }}**
            - Apple Developer ID / notarization secrets: **${{ needs.validate-tag.outputs.apple_signing }}**
            - Windows Authenticode secrets: **${{ needs.validate-tag.outputs.windows_signing }}**

            `latest.json` is published only when signed updater artifacts (`.sig`) exist.
          files: dist/publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
